<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Artículo</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tiny.cloud/1/e9vgjen8lq07idu3qta9fdhs3guomds7c0xfdt74fbmvbnmb/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 600px;
            max-width: 90%;
            margin-top: 50px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 5px; 
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 14px;
        }
        input[type="file"] {
            margin-bottom: 20px;
        }
        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .buttons button {
            width: 48%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }
        .buttons .preview {
            background-color: #007bff;
            color: #fff;
        }
        .buttons .submit {
            background-color: #28a745;
            color: #fff;
        }
        .error {
            color: red;
            font-size: 12px;
            display: none;
            margin-bottom: 10px; 
        }
    </style>
    <script>
        tinymce.init({
            selector: '#id_encabezado, #id_cuerpo',  // Ajustado para funcionar con los IDs generados por Django
            plugins: 'advlist autolink lists link image charmap print preview anchor textcolor',
            toolbar: 'undo redo | formatselect | bold italic backcolor | alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | removeformat',
            menubar: false,
            height: 300,
        });

        function previewContent() {
            const titleContent = encodeURIComponent(tinymce.get('id_encabezado').getContent());
            const bodyContent = encodeURIComponent(tinymce.get('id_cuerpo').getContent());
            const imageInput = document.getElementById('id_imagen').files[0];
            
            let imageDataURL = '';
            if (imageInput) {
                const reader = new FileReader();
                reader.onloadend = function () {
                    imageDataURL = encodeURIComponent(reader.result);
                    openPreviewWindow(titleContent, bodyContent, imageDataURL);
                };
                reader.readAsDataURL(imageInput);
            } else {
                openPreviewWindow(titleContent, bodyContent, '');
            }
        }

        function openPreviewWindow(title, body, image) {
            const previewWindow = window.open('{% url "previsualizacion" publicacion.pk %}', '_blank', 'width=' + screen.width + ',height=' + screen.height + ',fullscreen=yes');
            if (window.focus) previewWindow.focus();
        }
    </script>
</head>
<body>
    <div class="container">
        <h2>Crear artículo</h2>
        <form id="articleForm" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}  <!-- Genera el formulario con los campos del modelo Publicacion -->

            <div class="buttons">
                <button type="button" class="preview" onclick="previewContent()">Previsualizar</button>
                <button type="submit" class="submit">Guardar Artículo</button>
            </div>
        </form>
    </div>
</body>
</html>
