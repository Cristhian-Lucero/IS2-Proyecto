<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsualización del Artículo</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 800px;
            max-width: 90%;
            margin: 50px auto;
            overflow-wrap: break-word; /* Para evitar que el texto se salga del cuadro */
        }
        h2 {
            text-align: center;
            margin-top: 0;
        }
        h3 {
            text-align: center;
            margin-bottom: 20px;
            word-wrap: break-word;
        }
        .preview-image {
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .buttons .accept {
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            background-color: #28a745;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Previsualización del Artículo</h2>
        <img id="previewImage" class="preview-image" src="#" alt="Imagen de Previsualización" style="display: none;">
        <h3 id="previewTitle"></h3>
        <div id="previewBody"></div>
        <div class="buttons">
            <button type="button" class="accept" onclick="window.close()">Aceptar</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            
            const title = urlParams.get('title');
            const body = urlParams.get('body');
            const image = urlParams.get('image');

            document.getElementById('previewTitle').innerHTML = title;
            document.getElementById('previewBody').innerHTML = body;

            if (image) {
                document.getElementById('previewImage').src = image;
                document.getElementById('previewImage').style.display = 'block';
            } else {
                document.getElementById('previewImage').style.display = 'none';
            }
        }
    </script>
</body>
</html>
