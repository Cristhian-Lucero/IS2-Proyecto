<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Publicaciones</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 800px;
            max-width: 90%;
            margin-top: 50px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .publication {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #f9f9f9;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }
        h3 {
            margin-top: 0;
            font-size: 18px;
        }
        p {
            font-size: 14px;
            color: #555;
        }
        .buttons {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }
        .buttons a {
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
            margin-left: 10px;
            color: #fff;
        }
        .buttons .edit {
            background-color: #007bff;
        }
        .buttons .delete {
            background-color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Mis Publicaciones</h2>
        {% for publicacion in publicaciones %}
            <div class="publication">
                <h3>{{ publicacion.encabezado }}</h3>
                <p>{{ publicacion.cuerpo|truncatewords:20 }}</p>
                <div class="buttons">
                    <a href="{% url 'modificar_publicacion' publicacion.pk %}" class="edit">Modificar</a>
                    <a href="{% url 'eliminar_publicacion' publicacion.pk %}" class="delete" onclick="return confirm('¿Estás seguro de que deseas eliminar esta publicación?')">Eliminar</a>
                </div>
            </div>
        {% endfor %}
    </div>
</body>
</html>
