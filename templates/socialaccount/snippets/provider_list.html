{% load i18n %}
{% load socialaccount %}
{% get_providers as socialaccount_providers %}
{% if socialaccount_providers %}
    <div class="social-login-buttons">
        {% for provider in socialaccount_providers %}
            <a class="btn btn-primary" href="{% provider_login_url provider.id %}">
                {% trans provider.name %}
            </a>
        {% endfor %}
    </div>
{% endif %}
