<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Personalizado</title>
    {% load static %}
    <link rel="shortcut icon" href="{% static 'css/favicon.ico' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: black;
        }
        .container {
            display: flex;
            justify-content: space-between;
            height: 100vh;
        }
        .sidebar {
            width: 20%;
            background-color: #fff;
            border-right: 1px solid #ddd;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .sidebar h2 {
            text-align: center;
            font-size: 1.5em;
        }
        .block {
            padding: 10px;
            background-color: #4a90e2;
            color: white;
            margin-bottom: 10px;
            text-align: center;
            cursor: grab;
            border-radius: 5px;
        }
        .block:hover {
            background-color: #357abd;
        }
        .editor {
            width: 75%;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            min-height: 100vh;
        }
        .editor h2 {
            text-align: center;
            font-size: 1.5em;
            color: #4a90e2;
        }
        .dropzone {
            min-height: 500px;
            border: 2px dashed #ccc;
            padding: 20px;
            text-align: center;
            background-color: #f9f9f9;
            border-radius: 10px;
        }
        .dropzone .block {
            margin-bottom: 15px;
            padding: 20px;
            background-color: #eee;
            text-align: left;
            position: relative;
        }
        .dropzone .block img {
            width: 100px;
            height: auto;
        }
        input[type="file"] {
            display: none;
        }
        .save-button {
            display: block;
            width: 100%;
            padding: 10px 0;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        .save-button:hover {
            background-color: #45a049;
        }
        .delete-button {
            position: absolute;
            top: 5px;
            right: 10px;
            background-color: red;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h2>Elementos</h2>
        <div class="block" draggable="true" data-type="heading">Encabezado</div>
        <div class="block" draggable="true" data-type="text">Texto</div>
        <div class="block" draggable="true" data-type="quote">Cita</div>
        <div class="block" draggable="true" data-type="image">Imagen</div>
        <input type="file" id="fileInput" accept="image/*">
        <button id="saveButton" class="save-button">Guardar</button> 
    </div>

    <div class="editor">
        <h2>Área de Personalización</h2>
        <div id="dropzone" class="dropzone">
            Arrastra y suelta bloques aquí
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const blocks = document.querySelectorAll('.block');
        const dropzone = document.getElementById('dropzone');
        const saveButton = document.getElementById('saveButton');
        const fileInput = document.getElementById('fileInput');

        let headingCount = 0;
        let textCount = 0;
        let quoteCount = 0;
        let imageCount = 0;

        blocks.forEach(block => {
            block.addEventListener('dragstart', function (e) {
                e.dataTransfer.setData('type', this.getAttribute('data-type'));
            });
        });

        dropzone.addEventListener('dragover', function (e) {
            e.preventDefault();
        });

        dropzone.addEventListener('drop', function (e) {
            e.preventDefault();
            const type = e.dataTransfer.getData('type');
            let element = null;

            if (type === 'image' && imageCount < 2) {
                element = document.createElement('img');
                element.alt = 'Imagen personalizada';
                element.style.width = '100%';
                showImageUploadDialog(element);
                imageCount++;
            } else if (type === 'heading' && headingCount < 1) {
                element = createElement(type);
                headingCount++;
            } else if (type === 'text' && textCount < 2) {
                element = createElement(type);
                textCount++;
            } else if (type === 'quote' && quoteCount < 1) {
                element = createElement(type);
                quoteCount++;
            } else {
                alert('Has alcanzado el límite de elementos permitidos.');
                return;
            }

            if (element) {
                const blockDiv = document.createElement('div');
                blockDiv.className = 'block';
                blockDiv.appendChild(element);

                // Crear el botón de eliminar
                const deleteButton = document.createElement('button');
                deleteButton.className = 'delete-button';
                deleteButton.textContent = 'Eliminar';
                deleteButton.addEventListener('click', function () {
                    blockDiv.remove();
                    if (type === 'heading') headingCount--;
                    if (type === 'text') textCount--;
                    if (type === 'quote') quoteCount--;
                    if (type === 'image') imageCount--;
                });

                blockDiv.appendChild(deleteButton);
                dropzone.appendChild(blockDiv);
            }
        });

        function createElement(type) {
            let element = null;
            switch (type) {
                case 'heading':
                    element = document.createElement('h3');
                    element.textContent = 'Nuevo Encabezado';
                    element.style.color = 'black';
                    element.contentEditable = 'true';
                    break;
                case 'text':
                    element = document.createElement('p');
                    element.textContent = 'Este es un bloque de texto.';
                    element.style.color = 'black';
                    element.contentEditable = 'true';
                    break;
                case 'quote':
                    element = document.createElement('blockquote');
                    element.textContent = 'Este es un bloque de cita.';
                    element.style.fontStyle = 'italic';
                    element.style.borderLeft = '5px solid #4a90e2';
                    element.style.paddingLeft = '10px';
                    element.style.color = 'black';
                    element.contentEditable = 'true';
                    break;
            }
            return element;
        }

        function showImageUploadDialog(imgElement) {
            fileInput.onchange = function(event) {
                const file = event.target.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    imgElement.src = e.target.result;
                };
                reader.readAsDataURL(file);
            };
            fileInput.click();
        }

        // Funcionalidad del botón Guardar
        saveButton.addEventListener('click', function () {
            alert("Publicación guardada con éxito!");
            
            // Redirige a la página de "Mis Publicaciones" después de 2 segundos
            setTimeout(function () {
                window.location.href = "{% url 'mis_publicaciones' %}"; 
            }, 2000);
        });

    });
</script>

</body>
</html>
