<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Publicación</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Cambié de 'center' a 'flex-start' */
            height: 100vh;
            overflow-y: auto; /* Asegura que el contenido se desplace si es necesario */
        }
        .form-container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 600px;
            max-width: 100%; /* Para que no exceda el ancho de la pantalla */
            margin-top: 20px; /* Espacio en la parte superior */
        }
        h1 {
            text-align: center;
            color: #4a90e2;
            font-size: 2em;
        }
        label {
            display: block;
            margin-top: 15px;
            font-size: 1.2em;
        }
        input, textarea {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1.1em;
        }
        .buttons {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .btn {
            background-color: #4a90e2;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            font-size: 1.2em;
        }
        .btn:hover {
            background-color: #357abd;
        }
        /* Mensaje de confirmación de borrador */
        #message {
            display: none;
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>Crear Publicación</h1>
        <!-- Formulario para crear una nueva publicación -->
        <form id="publicacionForm" action="{% url 'crear_publicacion' %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Campo para el título -->
            <label for="titulo">Encabezado</label>
            <input type="text" id="titulo" name="titulo" placeholder="Escribe el título de la publicación" required>

            <!-- Campo para el texto corto -->
            <label for="texto_corto">Texto 1</label>
            <textarea id="texto_corto" name="texto_corto" rows="4" placeholder="Escribe el texto corto de la publicación" required></textarea>

            <!-- Campo para el texto largo -->
            <label for="texto_largo">Texto 2</label>
            <textarea id="texto_largo" name="texto_largo" rows="6" placeholder="Escribe el texto largo de la publicación" required></textarea>

            <!-- Campo para la primera imagen -->
            <label for="imagen1">Imagen 1</label>
            <input type="file" id="imagen1" name="imagen1" required>

            <!-- Campo para la segunda imagen (opcional) -->
            <label for="imagen2">Imagen 2 (Opcional)</label>
            <input type="file" id="imagen2">

            <!-- Botón para guardar la publicación -->
            <div class="buttons">
                <button type="submit" class="btn">Guardar Publicación</button>
            </div>
        </form>a

        <!-- Mensaje que aparece después de guardar -->
        <div id="message">La publicación ha sido enviada a borrador.</div>
    </div>

    //ver como solucionar esto
    <script>
        document.getElementById('publicacionForm').onsubmit = function(event) {
            event.preventDefault();  // Evita el envío inmediato del formulario

            // Simula el guardado y muestra el mensaje
            var message = document.getElementById('message');
            message.style.display = 'block';

            // Redirige a Mis Publicaciones después de 2 segundos
            setTimeout(function() {
                window.location.href = "{% url 'mis_publicaciones' %}";
            }, 2000);
        };
    </script>

</body>
</html>
