{% extends 'encabezado.html' %}

{% block content%}
<head>
    <title>Crear Publicación</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .form-container {
            align-items: flex-start;
            background-color: #171717;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 600px;
            max-width: 100%;
            margin: 0 auto;
            margin-top: 10px;
        }
        h1 {
            text-align: center; 
            margin-bottom: 15px; 
            font-family: 'Yanone Kaffeesatz';
            font-size: 40px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-size: 1.2em;
        }
        input, textarea {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border-radius: 5px;
            font-size: 1.1em;
        }
        .buttons {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        #message {
            display: none;
            background-color: #4C994B;
            color: white;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Crear Publicación</h1>
    <div class="form-container">
        <form id="publicacionForm" action="{% url 'crear_publicacion' categoria_id %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <label for="titulo">Encabezado</label>
            <input type="text" id="titulo" name="titulo" placeholder="Escribe el título de la publicación" required>

            <label for="texto_corto">Texto 1</label>
            <textarea id="texto_corto" name="texto_corto" rows="4" placeholder="Escribe el texto corto de la publicación" required></textarea>

            <label for="texto_largo">Texto 2</label>
            <textarea id="texto_largo" name="texto_largo" rows="6" placeholder="Escribe el texto largo de la publicación" required></textarea>

            <label for="imagen1">Imagen 1</label>
            <input type="file" id="imagen1" name="imagen1" required>

            <label for="imagen2">Imagen 2 (Opcional)</label>
            <input type="file" id="imagen2" name="imagen2">

            <div class="buttons">
                <button type="submit" class="btn">Guardar Publicación</button>
            </div>
        </form>

        <div id="message">La publicación ha sido enviada a borrador.</div>
    </div>

    <script>
        document.getElementById('publicacionForm').onsubmit = function(event) {
            event.preventDefault();  // Evita el envío inmediato del formulario

            var form = document.getElementById('publicacionForm');
            var formData = new FormData(form);  // Crea un objeto FormData para enviar los datos

            // Simula el guardado y muestra el mensaje
            var message = document.getElementById('message');
            message.style.display = 'block';

            // Realiza el POST manualmente
            fetch(form.action, {
                method: 'POST',
                body: formData,
            })
            .then(response => {
                if (response.ok) {
                    // Redirige a Mis Publicaciones después de que se haga el POST correctamente
                    setTimeout(function() {
                        window.location.href = "{% url 'mis_publicaciones' %}";
                    }, 2000);
                } else {
                    // Maneja errores
                    console.error("Error al guardar la publicación");
                }
            })
            .catch(error => console.error("Error de red", error));
        };
    </script>
    
{% endblock %}
