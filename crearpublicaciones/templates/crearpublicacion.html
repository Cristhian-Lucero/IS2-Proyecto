<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Publicación</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 400px;
        }
        h1 {
            text-align: center;
            color: #4a90e2;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .btn {
            background-color: #4a90e2;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            width: 45%;
        }
        .btn:hover {
            background-color: #357abd;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>Crear Publicación</h1>
        <!-- Formulario para crear una nueva publicación -->
        <form action="{% url 'crear_publicacion' %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Campo para el título -->
            <label for="titulo">Encabezado</label>
            <input type="text" id="titulo" name="titulo" placeholder="Escribe el título de la publicación" required>

            <!-- Campo para el texto corto -->
            <label for="texto_corto">Texto 1</label>
            <textarea id="texto_corto" name="texto_corto" rows="4" placeholder="Escribe el texto corto de la publicación" required></textarea>

            <!-- Campo para el texto largo -->
            <label for="texto_largo">Texto 2</label>
            <textarea id="texto_largo" name="texto_largo" rows="6" placeholder="Escribe el texto largo de la publicación" required></textarea>

            <!-- Campo para la primera imagen -->
            <label for="imagen1">Imagen 1</label>
            <input type="file" id="imagen1" name="imagen1" required>

            <!-- Campo para la segunda imagen (opcional) -->
            <label for="imagen2">Imagen 2 (Opcional)</label>
            <input type="file" id="imagen2" name="imagen2">

            <!-- Botones de Previsualizar y Guardar -->
            <div class="buttons">
                <!-- Botón para previsualizar (después de guardar) -->
                <a href="{% url 'previsualizar_publicacion' publicacion.id %}" class="btn">Previsualizar</a>

                <!-- Botón para guardar la publicación -->
                <button type="submit" class="btn">Guardar Publicación</button>
            </div>
        </form>
    </div>

</body>
</html>
