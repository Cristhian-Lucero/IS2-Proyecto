<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Publicación</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        form {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 600px;
            max-width: 100%;
        }
        h1 {
            text-align: center;
            color: #4a90e2;
            margin-bottom: 30px;
        }
        label {
            display: block;
            font-size: 1.1em;
            margin-top: 15px;
            color: #333;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1.1em;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        .btn-primary {
            font-family: 'Montserrat', sans-serif;
            background-color: #4a90e2;
            color: white;
            padding: 15px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            display: block;
            width: 100%;
            margin-top: 30px;
            font-size: 1.1em;
        }
        .btn-primary:hover {
            background-color: #357abd;
        }
        /* Mensaje de éxito (opcional) */
        #success-message {
            display: none;
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <h1>Modificar Publicación</h1>
        {{ form.as_p }}
        <button type="submit" class="btn-primary">Guardar Cambios</button>
        <div id="success-message">¡Publicación modificada con éxito!</div> <!-- Mensaje opcional -->
    </form>

</body>
</html>
