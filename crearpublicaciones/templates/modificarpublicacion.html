{% extends 'rol/encabezado.html' %}

{% block content%}
<head>
    <title>Modificar Publicación</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        form {
            margin: 0 auto;
            margin-bottom: 5%;
            background-color: #171717;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 600px;
            max-width: 100%;
        }
        h1 {
            text-align: center; 
            margin-bottom: 15px; 
            font-family: 'Yanone Kaffeesatz';
            font-size: 40px;
        }
        label {
            display: block;
            font-size: 1.1em;
            margin-top: 15px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1.1em;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        .btn-primary {
            font-family: 'Montserrat', sans-serif;
            background-color: #4a90e2;
            color: white;
            padding: 15px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            display: block;
            width: 100%;
            margin-top: 30px;
            font-size: 1.1em;
        }
        .btn-primary:hover {
            background-color: #357abd;
        }
        /* Mensaje de éxito (opcional) */
        #success-message {
            display: none;
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Modificar Publicación</h1>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">Guardar Cambios</button>
        <div id="success-message">¡Publicación modificada con éxito!</div> <!-- Mensaje opcional -->
    </form>
{% endblock %}
