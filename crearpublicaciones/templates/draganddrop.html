<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrastrar y Soltar Publicación</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f0f0;
        }
        .container {
            width: 80%;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .dropzone {
            border: 2px dashed #ccc;
            width: 100%;
            height: 200px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ccc;
            transition: border-color 0.3s ease;
        }
        .dropzone.dragover {
            border-color: #007bff;
            color: #007bff;
        }
        .draggable {
            padding: 10px;
            border: 1px solid #007bff;
            border-radius: 10px;
            cursor: grab;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Arrastra y Suelta los Elementos</h1>

    <!-- Texto 1 -->
    <div class="draggable" draggable="true" id="text1">Este es el Texto 1</div>

    <!-- Imagen 1 -->
    <div class="draggable" draggable="true" id="image1">
        <img src="URL_DE_IMAGEN_1" alt="Imagen 1" width="100">
    </div>

    <!-- Área de arrastre para colocar el contenido -->
    <div class="dropzone" id="dropzone1">Suelta aquí el contenido</div>

    <!-- Previsualizar botón -->
    <button onclick="submitForm()">Previsualizar</button>
</div>

<script>
    const dropzones = document.querySelectorAll('.dropzone');
    const draggables = document.querySelectorAll('.draggable');

    draggables.forEach(draggable => {
        draggable.addEventListener('dragstart', () => {
            draggable.classList.add('dragging');
        });

        draggable.addEventListener('dragend', () => {
            draggable.classList.remove('dragging');
        });
    });

    dropzones.forEach(dropzone => {
        dropzone.addEventListener('dragover', e => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });

        dropzone.addEventListener('drop', e => {
            e.preventDefault();
            const draggable = document.querySelector('.dragging');
            dropzone.appendChild(draggable);
            dropzone.classList.remove('dragover');
        });
    });

    // Función para enviar el contenido al servidor y previsualizar
    function submitForm() {
        const text1 = document.getElementById('text1').innerHTML;
        const image1Src = document.getElementById('image1').querySelector('img').src;

        // Enviar los datos al servidor (Django)
        const formData = {
            text1: text1,
            image1: image1Src,
            // Añade más datos si es necesario
        };

        console.log("Datos para previsualización:", formData);
    }
</script>

</body>
</html>
