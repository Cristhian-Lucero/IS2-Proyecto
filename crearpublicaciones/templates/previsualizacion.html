<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsualización</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        .container {
            width: 70%;
            margin: 20px auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        header h2, header p {
            margin: 0;
            font-weight: bold;
        }
        .content {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .text {
            width: 60%;
        }
        .text h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .text p {
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .image {
            width: 35%;
        }
        .image img {
            width: 100%;
            border-radius: 10px;
        }
        .bottom-image {
            margin-top: 40px;
            width: 100%;
        }
        .bottom-image img {
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <!-- Mostrar el nombre del usuario que creó la publicación -->
            <h2>{{ user.username }}</h2>
            <!-- Mostrar la fecha actual -->
            <p>{% now "d \d\e F" %}</p>
        </header>

        <div class="content">
            <div class="text">
                <h1>{{ publicacion.titulo }}</h1>
                <p>{{ publicacion.texto_corto }}</p>
            </div>
            <div class="image">
                <img src="{{ publicacion.imagen1.url }}" alt="Imagen principal">
            </div>
        </div>

        <div class="text">
            <p>{{ publicacion.texto_largo }}</p>
        </div>

        {% if publicacion.imagen2 %}
        <div class="bottom-image">
            <img src="{{ publicacion.imagen2.url }}" alt="Imagen adicional">
        </div>
        {% endif %}
    </div>
</body>
</html>
