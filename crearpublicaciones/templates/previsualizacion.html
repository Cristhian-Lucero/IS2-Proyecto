<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsualización</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
        }
        .container {
            width: 80%;
            margin: 0 auto;
            max-width: 1200px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 2px solid #333;
            margin-bottom: 20px;
        }
        header h2, header p {
            margin: 0;
            font-weight: bold;
        }
        .content {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        .text {
            width: 55%;
        }
        .text h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .text p {
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .image {
            width: 40%;
        }
        .image img {
            width: 100%;
            border-radius: 10px;
        }
        .bottom-text {
            margin-top: 20px;
            width: 100%;
        }
        .bottom-image {
            margin-top: 40px;
            width: 100%;
        }
        .bottom-image img {
            width: 100%;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <!-- Nombre del usuario que crea la publicación -->
            <h2>{{ user.username }}</h2>
            <!-- Fecha actual corregida -->
            <p>{% now "j de F de Y" %}</p>
        </header>

        <div class="content">
            <!-- Texto 1 a la izquierda -->
            <div class="text">
                <h1>{{ publicacion.titulo }}</h1>
                <p>{{ publicacion.texto_corto|truncatechars:150 }}</p>
            </div>
            <!-- Imagen 1 a la derecha -->
            <div class="image">
                <img src="{{ publicacion.imagen1.url }}" alt="Imagen principal">
            </div>
        </div>

        <!-- Texto 2 en la parte inferior -->
        <div class="bottom-text">
            <p>{{ publicacion.texto_largo }}</p>
        </div>

        <!-- Imagen 2 debajo del texto largo -->
        {% if publicacion.imagen2 %}
        <div class="bottom-image">
            <img src="{{ publicacion.imagen2.url }}" alt="Imagen adicional">
        </div>
        {% endif %}
    </div>
</body>
</html>
