<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Publicaciones</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #4a90e2;
            font-size: 2em;
        }
        .publicacion-list {
            list-style: none;
            padding: 0;
        }
        .publicacion-list li {
            background-color: #f9f9f9;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .publicacion-list h3 {
            margin: 0 0 10px;
            color: #333;
            font-size: 1.5em;
        }
        .publicacion-list p {
            margin: 0 0 15px;
            color: #666;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* número de líneas visibles */
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .publicacion-actions {
            display: flex;
            gap: 10px;
        }
        .publicacion-actions a, .publicacion-actions button {
            padding: 10px 15px;
            background-color: #4a90e2;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1em;
            border: none;
            cursor: pointer;
            text-align: center;
            display: inline-block;
            width: 120px; /* Fuerza el mismo ancho para todos los botones */
        }
        .publicacion-actions a:hover, .publicacion-actions button:hover {
            background-color: #357abd;
        }
        .publicacion-actions button {
            background-color: #4a90e2;
        }
        .publicacion-actions form {
            display: inline;
        }
        /* Estilo para el mensaje cuando no hay publicaciones */
        .no-publicaciones {
            text-align: center;
            color: #666;
            font-size: 1.2em;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Mis Publicaciones</h2>
        
        {% if publicaciones %}
            <ul class="publicacion-list">
                {% for publicacion in publicaciones %}
                    <li>
                        <h3>{{ publicacion.titulo }}</h3>
                        <!-- Truncamos el texto corto para evitar desbordamientos -->
                        <p>{{ publicacion.texto_corto|truncatechars:100 }}</p>

                        <!-- Opcional: Enlaces para previsualizar, modificar o eliminar la publicación -->
                        <div class="publicacion-actions">
                            <a href="{% url 'previsualizar_publicacion' publicacion.id %}">Previsualizar</a>
                            <a href="{% url 'modificar_publicacion' publicacion.id %}">Modificar</a>
                            <a href="{% url 'eliminar_publicacion' publicacion.id %}">Eliminar</a>
                        </div>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p class="no-publicaciones">No tienes publicaciones aún.</p>
        {% endif %}
    </div>
</body> 
</html>
