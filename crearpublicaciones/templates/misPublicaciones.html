<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Publicaciones</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin-bottom: 20px;
        }
        .buttons {
            margin-top: 10px;
        }
        button {
            padding: 5px 10px;
            margin-right: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mis Publicaciones</h1>

        <ul>
            {% for publicacion in publicaciones %}
            <li>
                <h3>{{ publicacion.titulo }}</h3>
                <div class="buttons">
                    <button onclick="location.href='{% url 'previsualizar_publicacion' publicacion.id %}'">Previsualizar</button>
                    <button onclick="location.href='{% url 'modificar_publicacion' publicacion.id %}'">Modificar</button>
                    <form action="{% url 'eliminar_publicacion' publicacion.id %}" method="POST" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit">Eliminar</button>
                    </form>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
