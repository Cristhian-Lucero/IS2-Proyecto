<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Eliminación</title>
    <style>
        /* Estilos CSS */
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        .button {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }

        .button:hover {
            background-color: #c82333;
        }

        .button-cancelar {
            background-color: #6c757d;
            color: white;
        }

        .button-cancelar:hover {
            background-color: #5a6268;
        }

        p {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>¿Estás seguro de que quieres eliminar esta publicación?</h2>
        <p>{{ publicacion.encabezado }}</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="button">Eliminar</button>
            <a href="{% url 'mis_publicaciones' %}" class="button button-cancelar">Cancelar</a>
        </form>
    </div>
</body>
</html>
