<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Yanone+Kaffeesatz:wght@200..700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
   <style>
        body {
            background-color: #202124;
            font-family: 'Poppins', sans-serif;
            color: #FFFFFF;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .logo h1 {
            font-family: 'Yanone Kaffeesatz','Montserrat', sans-serif;
            font-weight: 700;
            font-size: 50px;
            color: #fff;
        }
        h3 {
            font-size: 2.5em;
            text-decoration: underline;
            color: #4a90e2; /* Azul suave */
            margin-bottom: 20px;
        }
        #formulario {
            background-color: #171717;
            border-radius: 38px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            padding: 2em;
            width: 400px;
        }
        .btn-primary {
            font-family: 'Montserrat', sans-serif;
            color: white;
            background-color: #4a90e2;
            font-size: 1em;
            padding: 0.75em 1.5em;
            border: none;
            border-radius: 5px;
            margin: 10px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-primary:hover {
            background-color: #357abd;
        }
        a {
            text-decoration: none;
            color: #4a90e2;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="formulario">
        <div class="logo">
            <h1>Journal X</h1>
        </div>
        {% if request.user.is_authenticated %}
            <hr>
            <h4>{{ user.username | upper }}, Bienvenido</h4>
            <a href="{% url 'exit' %}" class="btn-primary">Cerrar Sesión</a>
        {% else %}
            <h1>Debes Iniciar Sesión</h1>
            <br>
            <a href="{% url 'account_login' %}" class="btn-primary">Login</a>
            
        {% endif %}

    </div>
</body>
</html>
