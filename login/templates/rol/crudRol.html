{% extends 'rol/encabezado.html' %}

{% block content%}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Roles</title>
    <style>
        body {
            font-family: "Open Sans", sans-serif, Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            border-radius: 15px; /* Bordes redondeados externos */
            overflow: hidden;
        }
        table, th, td {
            border: 1px solid #606368;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #171717;
        }
        table {
            border: 1px solid #606368; /* Borde externo de la tabla */
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Gestión de Roles</h1>

    <!-- Formulario para añadir un nuevo rol -->
    <form method="POST"> 
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Crear Categoría</button>
    </form>
    

    <!-- Tabla de roles existentes -->
    <h2>Roles Existentes</h2>
    <table>
        <thead>
            <tr>
                <th>Rol</th>
                <th>Descripción</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>

            {% for i in roles %}

            <tr>
                <td> {{ i.nombre }} </td>
                <td> {{ i.descripcion }} </td>
                <td>
                    <button class="btn-edit" onclick="window.location.href='{% url 'editar_rol' i.id %}'">Editar</button>
                    
                    <form action="{% url 'eliminar_rol' i.id %}" method="post" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn-delete">Eliminar</button>
                    </form>

                </td>
            </tr>

            {% endfor %}
            
        </tbody>
    </table>
</div>

</body>

{% endblock %}
