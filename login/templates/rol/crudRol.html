{% extends 'rol/encabezado.html' %}

{% block content%}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Roles</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        table, th, td {
            border: 1px solid #ccc;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Gestión de Roles</h1>

    <!-- Formulario para añadir un nuevo rol -->
    <form action="/add-role" method="post">
        <div class="form-group">
            <label for="role-name">Nombre del nuevo rol:</label>
            <input type="text" id="role-name" name="role-name" required>
        </div>
    
        <div class="form-group">
            <label>Permisos:</label><br>
            {% for i in permisos %}
                <div style="margin-bottom: 8px;">
                    <input type="checkbox" id="permiso_{{ i.id }}" name="permisos" value="{{ i.descripcion }}">
                    <label for="permiso_{{ i.id }}" style="display: inline-block; margin-left: 5px;">{{ i.nombre }}</label>
                </div>
            {% endfor %}
        </div>
    
        <button type="submit">Añadir Rol</button>
    </form>
    

    <!-- Tabla de roles existentes -->
    <h2>Roles Existentes</h2>
    <table>
        <thead>
            <tr>
                <th>Rol</th>
                <th>Descripción</th>
            </tr>
        </thead>
        <tbody>

            {% for i in roles %}

            <tr>
                <td> {{ i.nombre }} </td>
                <td> {{ i.descripcion }} </td>
            </tr>

            {% endfor %}
            
        </tbody>
    </table>
</div>

</body>

{% endblock %}
