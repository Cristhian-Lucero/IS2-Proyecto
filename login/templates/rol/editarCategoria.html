{% extends 'rol/encabezado.html' %}

{% block content%}
<head>
    <title>Editar Categoría</title>
    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], select, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Editar Categoría</h1>
        <form action="{% url 'editar_categoria' categoria.id %}" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Guardar Cambios</button>
        </form>
    </div>

{% endblock %}
