<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encabezado con Links</title>
    <style>
        /* Estilos básicos para el encabezado */
        
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        header {
            background-color: #333;
            color: white;
            padding: 15px 20px;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            padding: 8px 15px;
            border-radius: 5px;
        }

        nav a:hover {
            background-color: #575757;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-right: auto;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <a href="/" style="color: white; text-decoration: none;">Journal X</a>
        </div>
        <nav>
            <a href="/">Inicio</a>
            <a href="/gestionrol">Gestion de Rol</a>
            <a href="/adicionrol">Nuevo Rol</a>
            <a href="/gestioncategoria">Gestión Categoría</a>
        </nav>
    </header>

    <!-- Resto del contenido de la página -->
    <div class="content">
        {% block content %}
        <!-- El contenido específico de cada página se insertará aquí -->
        {% endblock %}
    </div>

</body>
</html>
