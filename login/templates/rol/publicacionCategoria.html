{% extends 'encabezado.html' %}

{% block content%}
<head>
    <title>Pagina de Inicio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>

        .welcome {
            font-size: 18px;
            text-align: justify;
            margin-left: 10%;
            margin-bottom: 20px;
        }

        .article-container {
            display: flex;
            align-items: flex-start;
            background-color: #171717;
            padding: 20px;
            border-radius: 20px;
            margin-left: 15%;
            margin-right: 15%;
            margin-bottom: 2%;
        }

        .article-container img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            padding: 10;
            margin: 20px;
        }

        .article-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .description {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1 style="text-transform: uppercase; text-align: center;"> {{ categoria_seleccionada }} </h1>
    <br>
    {% for i in publicaciones %}
        <div class="article-container" style="text-align: justify;">
            <img src="{{ i.imagen1.url }}"  alt="Perfil">
            <div class="article-content">
                <h2 style="text-transform: uppercase;" class="article-title">{{ i.titulo }}</h2>
                <div class="category"> <a style="text-transform: uppercase;" href="#">{{ i.categoria.descripcion_corta }}</a> </div>
                <div class="description">
                    {{ i.texto_corto }}
                </div>
                <a class="read-more" href="{% url 'previsualizar_publicacion' i.id %}">LEER MÁS</a>
            </div>
        </div>
    {% endfor %}

{% endblock %}
