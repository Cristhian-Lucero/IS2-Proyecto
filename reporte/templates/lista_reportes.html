{% extends 'encabezado.html' %}

{% block content%}
<head>
    <title>Reportes</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>

        h1 {
            text-align: center; 
            margin-bottom: 5%; 
            font-family: 'Yanone Kaffeesatz';
            font-size: 40px;
        }

        .article-container {
            display: flex;
            align-items: flex-start;
            background-color: #171717;
            padding: 20px;
            border-radius: 20px;
            margin-left: 15%;
            margin-right: 15%;
            margin-bottom: 2%;

        }

        .article-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .description {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .eliminar {
            background-color: #D24330;
        }
        .previsualizar{
            background-color: #4C994B;
        }
        .reporte-actions a, .reporte-actions button {
            padding: 10px 15px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1em;
            border: none;
            cursor: pointer;
            text-align: center;
            display: inline-block;
            width: 120px;
            margin-right: 10px;
        }
    </style>
</head>
<body>

    <h1>Reportes</h1>
    {% for i in reportes %}
        <div class="article-container" style="text-align: justify;">
            <div class="article-content">
                <h2 class="article-title">{{ i.titulo }}</h2>
                <h3 class="article-title">{{ i.tipo }}</h3>
                <div class="description">
                    <p>{{ i.fecha_creacion }}</p>
                    <p>Guardado por: {{ i.user }}</p>
                </div>
                
                <div class="reporte-actions">
                    <a class="previsualizar" href="{% url 'visualizarReporte' i.id %}">VISUALIZAR</a>
                    <a class="eliminar" href="{% url 'eliminarReporte' i.id %}" onclick="return confirm('¿Estás seguro de que deseas eliminar este reporte?');">ELIMINAR</a>
                </div>
            </div>
        </div>
    {% endfor %}

{% endblock %}
